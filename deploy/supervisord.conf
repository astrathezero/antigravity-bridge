[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb_err.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox_err.log

[program:x11vnc]
command=/app/deploy/start-vnc.sh
environment=DISPLAY=":99"
autorestart=true
priority=30
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc_err.log

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=35
stdout_logfile=/var/log/websockify.log
stderr_logfile=/var/log/websockify_err.log

[program:bridge]
command=python3 /app/antigravity_bridge.py --host 0.0.0.0 --port 8000
autorestart=true
priority=40
stdout_logfile=/var/log/bridge.log
stderr_logfile=/var/log/bridge_err.log

[program:browser]
command=/app/deploy/start-browser.sh
environment=DISPLAY=":99"
autorestart=true
priority=50
stopsignal=TERM
stopwaitsecs=25
stdout_logfile=/var/log/browser.log
stderr_logfile=/var/log/browser_err.log
