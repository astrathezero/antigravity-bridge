services:
  antigravity-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: antigravity-bridge:latest
    container_name: antigravity-bridge
    restart: unless-stopped
    ports:
      # noVNC web desktop (Nginx reverse proxy handles SSL termination externally)
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
      # Antigravity Bridge API (use BRIDGE_PORT=8080 if 8000 is running locally)
      - "127.0.0.1:${BRIDGE_PORT:-8000}:8000"
    volumes:
      # Chrome profile per-account (persistent login sessions on host)
      - ./chrome-data:/app/chrome-data
      # Startup scripts (mount live so changes take effect on restart)
      - ./supervisord.conf:/app/deploy/supervisord.conf:ro
      - ./start-browser.sh:/app/deploy/start-browser.sh:ro
      - ./start-vnc.sh:/app/deploy/start-vnc.sh:ro
      # Extension (read-only — reload container to pick up changes)
      - ../extension:/app/extension:ro
      # Bridge server (read-only — use safe_deploy.sh on host to update)
      - ../antigravity_bridge.py:/app/antigravity_bridge.py:ro
      # Test suite (read-only — for running tests inside container)
      - ../test_bridge.py:/app/test_bridge.py:ro
      # Bridge config (profiles, routing, etc.)
      - ../bridge_config.json:/app/bridge_config.json
      # Gemini CLI profiles (agy) — optional, for CLI fallback
      - ~/.gemini:/root/.gemini
    environment:
      - NOVNC_PASSWORD=${NOVNC_PASSWORD:-changeme}
      - PYTHONUNBUFFERED=1
      # Window and UI scaling for Chromium in noVNC (0.8 = 80%, 1.0 = 100%)
      - CHROME_SCALE=${CHROME_SCALE:-0.8}
      # Number of Chrome windows to open at startup (one per Google account slot)
      - CHROME_ACCOUNTS=${CHROME_ACCOUNTS:-2}
      # Comma-separated list of Gemini URLs for each Chrome window
      # Format: "url1,url2,url3,..." — defaults to /app and /u/1/app ... /u/9/app
      - CHROME_URLS=${CHROME_URLS:-}
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
